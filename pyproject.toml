[project]
name = "care-asd"
version = "0.1.0"
description = "CARE-ASD: Causal Acoustic-Path and Reliability-Calibrated Anomalous Sound Detection"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "CARE-ASD Research" },
]
keywords = [
    "anomalous-sound-detection",
    "DCASE",
    "acoustic-path",
    "calibration",
    "edge",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "omegaconf>=2.3",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "rich>=13.7",
    "scipy>=1.11",
    "soundfile>=0.12",
    "typer>=0.12",
]

[project.optional-dependencies]
torch = [
    "torch>=2.1",
    "torchaudio>=2.1",
]
ml = [
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "psutil>=5.9",
]
deploy = [
    "onnx>=1.15",
    "onnxruntime>=1.16",
]
dev = [
    "mypy>=1.8",
    "pre-commit>=3.6",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.2",
    "types-PyYAML>=6.0",
]
# Full research stack without librosa (librosa optional; avoids numba pin conflicts on some platforms).
full = [
    "care-asd[torch,ml,deploy,dev]",
]

[project.scripts]
care-asd = "care_asd.cli:app"

[project.urls]
Homepage = "https://github.com/care-asd/care-asd"
Documentation = "https://github.com/care-asd/care-asd/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/care_asd"]

[dependency-groups]
dev = [
    "mypy>=1.8",
    "pre-commit>=3.6",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.2",
    "types-PyYAML>=6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = [
    "CARE_ASD_CODEX_IMPLEMENTATION_PLAN.md",
    "*.md",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["care_asd"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = "src"
packages = ["care_asd"]

[[tool.mypy.overrides]]
module = [
    "soundfile.*",
    "torchaudio.*",
    "librosa.*",
    "sklearn.*",
    "onnxruntime.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "requires_data: marks tests that need real dataset (never run in CI by default)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["care_asd"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0
