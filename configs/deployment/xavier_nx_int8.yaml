# E2 INT8 comparison; calibration inputs must be normal training data only.
deployment:
  device_id: E2
  platform: jetson_xavier_nx
  backend: tensorrt
  runner: cpp_tensorrt
  precision: int8
  power_mode_w: 15
  warmup_windows: 100
  timed_windows: 1000
  repetitions: 3
  require_external_power_meter: true
