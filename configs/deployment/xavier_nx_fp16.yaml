# E2 primary edge/student benchmark. Validate exact module RAM and JetPack
# inventory on device before reporting results.
deployment:
  device_id: E2
  platform: jetson_xavier_nx
  backend: tensorrt
  runner: cpp_tensorrt
  precision: fp16
  power_mode_w: 15
  warmup_windows: 100
  timed_windows: 1000
  repetitions: 3
  require_external_power_meter: true
