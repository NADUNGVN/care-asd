supported_claims:
  - claim_id: contaminated_reference_is_real
    text: "The far microphone is a mixed observation rather than a guaranteed noise-only reference, creating a plausible fault-suppression risk for direct subtraction."
    source_ids: [nishida2026_task_description, kim2026_reference_denoising, lei2026_task_adapted_dual_mic]
    evidence_scope: "DCASE 2026 task framing and independent participant method descriptions."

  - claim_id: metric_gain_is_not_safety_evidence
    text: "Published ASD score gains from reference processing do not by themselves establish component-level fault preservation."
    source_ids: [kim2026_reference_denoising, morita2026_stereo_spatial, ozeki2026_simple_noise_reduction, qian2026_spectral_subtraction, kim2026_residual_view]
    evidence_scope: "The reviewed reports provide AUC-style endpoints but no injected-fault retention endpoint."

  - claim_id: audit_gap
    text: "The reviewed direct ASD sources do not jointly report known-component noise attenuation, fault retention, aligned anomaly-score effects, and frozen stop decisions."
    source_ids: [fujimura2026_na_ssl, kim2026_reference_denoising, morita2026_stereo_spatial, ozeki2026_simple_noise_reduction, qian2026_spectral_subtraction, kim2026_residual_view, lei2026_task_adapted_dual_mic]
    evidence_scope: "A bounded claim over the primary direct-ASD sources reviewed through the cutoff date."

  - claim_id: adjacent_precedent
    text: "Desired-signal leakage and preservation-versus-attenuation trade-offs are established signal-processing problems outside anomalous sound detection."
    source_ids: [alkindi1989_signal_leakage, xiao2024_target_delay_anc, zhao2025_aux_reference_aec]
    evidence_scope: "Adjacent adaptive cancellation, active control, and acoustic echo cancellation literature."

prohibited_claims:
  - claim_id: no_dual_mic_benefit
    text: "Do not claim that dual-microphone information is generally ineffective or harmful for anomalous sound detection."
    source_ids: [fujimura2026_na_ssl, kim2026_reference_denoising, morita2026_stereo_spatial, ozeki2026_simple_noise_reduction, qian2026_spectral_subtraction, kim2026_residual_view]
    evidence_scope: "Multiple direct ASD counterexamples report benefit from learned, signal-level, spatial, or embedding-space use."

  - claim_id: contamination_is_novel
    text: "Do not claim that contaminated-reference cancellation or desired-signal leakage is itself a new problem."
    source_ids: [alkindi1989_signal_leakage, xiao2024_target_delay_anc]
    evidence_scope: "Peer-reviewed signal-processing prior art predates this ASD study."

  - claim_id: universal_impossibility
    text: "Do not claim a universal impossibility theorem for safe normal-only reference use or generalize beyond the tested controllers and controlled mixtures."
    source_ids: [fujimura2026_na_ssl, zhao2025_aux_reference_aec]
    evidence_scope: "Learned methods and alternative supervision or simulation regimes are explicit counter-scopes."

  - claim_id: peer_reviewed_dcase_reports
    text: "Do not describe DCASE challenge technical reports or the current arXiv papers as peer-reviewed journal evidence."
    source_ids: [dcase2026_submission_policy, kim2026_reference_denoising, morita2026_stereo_spatial, ozeki2026_simple_noise_reduction, qian2026_spectral_subtraction, kim2026_residual_view, lei2026_task_adapted_dual_mic, fujimura2026_na_ssl]
    evidence_scope: "DCASE explicitly distinguishes non-peer-reviewed challenge reports from workshop papers; arXiv is a preprint venue."
