    authors: "DCASE 2026 Task 2 organizers and participating teams"
    venue: "DCASE 2026 Challenge"
    publication_type: benchmark_specification
    review_status: official_specification
    url: "https://dcase.community/challenge2026/task-first-shot-unsupervised-anomalous-sound-detection-for-machine-condition-monitoring-results"
    cluster: task_context
    method_family: benchmark_definition
    normal_only_asd: true
    signal_level_transformation: false
    evaluates_asd_metrics: true
    evaluates_known_component_safety: false
    reports_reference_contamination: true
    result_direction: context
    key_finding: "The official result collection shows a broad performance frontier built from heterogeneous encoders, scoring backends, stereo views, calibration rules, and ensembles, with large machine-dependent variation."
    audit_relationship: "Defines the contemporary comparison set and prevents CARE-ASD from treating ordinary score fusion, stereo processing, or multi-backend ensembling as a new contribution."

