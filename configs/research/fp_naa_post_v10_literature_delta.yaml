supported_claims:
  - claim_id: backend_diversity_precedes_pooling
    text: "For the next bounded study, backend and representation diversity deserves priority over another temporal-pooling or same-representation branch search."
    source_ids: [zhou2026_backend_systematic, jiang2026_aithu_fusion, dcase2026_task_results]
    evidence_scope: "Direct ASD systematic evidence and current challenge system descriptions; not a universal theorem over every encoder or dataset."

  - claim_id: proxy_fault_selection_requires_external_validation
    text: "Pseudo-fault or proxy-outlier selection cannot by itself authorize a performance run because proxy discrimination may fail to rank real-anomaly backends."
    source_ids: [zhou2026_backend_systematic, mkrtchian2026_daco]
    evidence_scope: "A direct negative ASD result plus evidence that label-free criteria need an independent viability check."

  - claim_id: calibration_is_a_control_not_a_power_certificate
    text: "Domain-aware normal-score calibration is a necessary transfer control, but normal-distribution balance does not certify anomaly-detection power and requires a frozen viability veto."
    source_ids: [mkrtchian2026_daco]
    evidence_scope: "Cross-year ASD experiments with an explicitly disclosed degenerate-map failure mode."

  - claim_id: orthogonal_stereo_residual_is_conditional
    text: "Cross-channel predictive residuals remain mechanistically distinct from the failed V10 score branches, but only a new safety, identifiability, or transfer protocol could be a CARE-ASD contribution."
    source_ids: [jeong2026_cross_channel_residual, shokriazar2026_shiftall_ldknn]
    evidence_scope: "Current DCASE technical reports demonstrate the component families but do not report CARE-ASD's known-component preservation endpoints."

  - claim_id: no_immediate_v11_gpu_authorization
    text: "The literature delta does not justify immediate V11 GPU training; a successor must first state a mechanism not reducible to tail-threshold tuning, ordinary fusion, or reconstruction of a published ensemble."
    source_ids: [kajita2026_train_normal_profile, jiang2026_aithu_fusion, dcase2026_task_results]
    evidence_scope: "A go-or-no-go research-program decision combining current prior art with the already frozen CARE-ASD V10 failure."

prohibited_claims:
  - claim_id: top_tail_rescue_is_new
    text: "Do not present sparse top-tail rescue or a relaxed median-gain rule as a novel V11 mechanism."
    source_ids: [kajita2026_train_normal_profile]
    evidence_scope: "The aggregation family is already described and its reported development replay does not favor it over consensus."

  - claim_id: cross_channel_residual_is_prior_art
    text: "Do not claim that predicting one channel representation from the other and scoring the residual is itself novel."
    source_ids: [jeong2026_cross_channel_residual]
    evidence_scope: "A direct DCASE 2026 system description implements this mechanism with normal-only ridge prediction."

  - claim_id: dev_score_guarantees_unseen_transfer
    text: "Do not use development-score ranking alone as evidence that a configuration will transfer to unseen evaluation machine types."
    source_ids: [mkrtchian2026_daco, shokriazar2026_shiftall_ldknn]
    evidence_scope: "Direct transfer analysis and strict leave-one-machine-out validation practice."

  - claim_id: proxy_fault_gate_proves_real_anomaly_power
    text: "Do not claim that passing a synthetic or proxy-fault gate proves ranking power on real anomalies."
    source_ids: [zhou2026_backend_systematic]
    evidence_scope: "Proxy outliers saturate competing backends in the reported ASD study and fail to provide a useful selection signal."

  - claim_id: ordinary_score_fusion_is_novel
    text: "Do not claim generic score calibration, rank fusion, maximum fusion, or multi-branch ensembling as a CARE-ASD novelty."
    source_ids: [dcase2026_task_results, jiang2026_aithu_fusion, kajita2026_train_normal_profile]
    evidence_scope: "Multiple current primary system descriptions already cover these aggregation families."

  - claim_id: technical_reports_are_peer_reviewed
    text: "Do not describe DCASE challenge technical reports in this delta as peer-reviewed scientific evidence."
    source_ids: [dcase2026_submission_policy]
    evidence_scope: "The official challenge publication policy distinguishes technical reports from reviewed workshop papers."
